    <meta property="og:description" content="Aplikasi simpel untuk menyimpan, mengelola, dan membagikan foto produk serta kata-kata promosi secara offline di perangkat Anda." />

    <script>
      // Shim WebSocket untuk Vite HMR di lingkungan preview iframe AI Studio agar tidak terjadi galat koneksi
      (function () {
        if (typeof window === 'undefined') return;
        const NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;

        class ViteHmrShim extends EventTarget {
          constructor(url, protocols) {
            super();
            this.url = url;
            this.protocols = protocols;
            this.readyState = 1; // WebSocket.OPEN
            setTimeout(() => {
              this.dispatchEvent(new Event('open'));
            }, 10);
          }
          send() {}
          close() {
            this.readyState = 3; // WebSocket.CLOSED
          }
        }

        function PatchedWebSocket(url, protocols) {
          const isHmr =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (typeof url === 'string' && (url.includes('token=') || url.includes('24678')));
          if (isHmr) {
            return new ViteHmrShim(url, protocols);
          }
          return new NativeWebSocket(url, protocols);
        }

        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
        PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;

        window.WebSocket = PatchedWebSocket;

        window.addEventListener('error', function (e) {
          if (e.message && e.message.toLowerCase().includes('websocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (e.reason && String(e.reason).toLowerCase().includes('websocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
      })();
    </script>
  </head>
